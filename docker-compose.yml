
services:
  node-exporter:
    image: prom/node-exporter:v1.12.1
    container_name: node-exporter
    restart: unless-stopped
    ports:
      - "127.0.0.1:9101:9101"
    pid: host
    command:
      - --path.rootfs=/host
      - --web.listen-address=127.0.0.1:9101
    volumes:
      - /:/host:ro,rslave

  cadvisor:
    image: ghcr.io/google/cadvisor:0.55.1
    container_name: cadvisor
    restart: unless-stopped
    command:
      - --docker_only=true
      - --housekeeping_interval=15s
    ports:
      - "127.0.0.1:9000:8080"
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    network_mode: host
    environment:
      - LISTEN_IP=${LISTEN_IP:?Set LISTEN_IP in .env}
      - NODE_EXPORTER_PORT=${NODE_EXPORTER_PORT:?Set NODE_EXPORTER_PORT in .env}
      - CADVISOR_PORT=${CADVISOR_PORT:?Set CADVISOR_PORT in .env}
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/allowlist.conf:/etc/nginx/allowlist.conf:ro
      - /dev/null:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - node-exporter
      - cadvisor

